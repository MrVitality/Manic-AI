_format_version: "2.1"
_transform: true

services:
  - name: auth-v1-open
    url: http://supabase-auth:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors
  - name: auth-v1-open-callback
    url: http://supabase-auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors
  - name: auth-v1-open-authorize
    url: http://supabase-auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors
  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
  - name: rest-v1
    url: http://supabase-rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
  - name: storage-v1
    url: http://supabase-storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors

# =============================================================================
# SECURITY — ACTION REQUIRED BEFORE DEPLOYING
# =============================================================================
# The JWT keys below are placeholder example values. They MUST be replaced with
# keys generated for YOUR deployment before going to production.
#
# How to generate:
#   1. Choose a JWT_SECRET (e.g. openssl rand -base64 32)
#   2. Generate ANON_KEY and SERVICE_ROLE_KEY at:
#      https://supabase.com/docs/guides/self-hosting#api-keys
#   3. Replace the 'key:' values below with your generated keys
#   4. Set the same values as ANON_KEY and SERVICE_ROLE_KEY in your .env file
#
# WARNING: Using the placeholder keys in production is a critical security risk.
# =============================================================================
consumers:
  - username: anon
    keyauth_credentials:
      - key: REPLACE_WITH_YOUR_ANON_KEY  # Generate at supabase.com/docs/guides/self-hosting#api-keys
  - username: service_role
    keyauth_credentials:
      - key: REPLACE_WITH_YOUR_SERVICE_ROLE_KEY  # Generate at supabase.com/docs/guides/self-hosting#api-keys

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - X-Auth-Token
        - Authorization
        - apikey
        - x-client-info
      exposed_headers:
        - X-Total-Count
      credentials: true
      max_age: 3600
