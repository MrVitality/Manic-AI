name: manic-ai

services:
  # ===========================================================================
  # Edge — Reverse Proxy
  # ===========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: ai-caddy
    restart: unless-stopped
    ports:
      - "${BIND_IP}:80:80"
      - "${BIND_IP}:443:443"
      - "${BIND_IP}:443:443/udp"  # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${PUBLIC_DOMAIN:-manixsystems.cloud}
    depends_on:
      - api
      - frontend
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Core AI Services
  # ===========================================================================
  ollama:
    image: ollama/ollama:0.6.2
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${BIND_IP}:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"
        reservations:
          memory: 4G
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "${BIND_IP}:6333:6333"
      - "${BIND_IP}:6334:6334"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY must be set}
    volumes:
      - qdrant-data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: ai-redis
    restart: unless-stopped
    ports:
      - "${BIND_IP}:6380:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: ai-redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://ai-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "${BIND_IP}:9121:9121"
    depends_on:
      - redis
    networks:
      - db-network
      - monitoring-network
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Supabase Stack
  # ===========================================================================
  supabase-db:
    image: supabase/postgres:15.1.1.78
    container_name: ai-supabase-db
    restart: unless-stopped
    ports:
      - "${BIND_IP}:5433:5432"
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./supabase/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    env_file:
      - .env
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - listen_addresses=localhost,supabase-db
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  supabase-auth:
    image: supabase/gotrue:v2.143.0
    container_name: ai-supabase-auth
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - db-network
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9999/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  supabase-rest:
    image: postgrest/postgrest:v12.0.1
    container_name: ai-supabase-rest
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - db-network
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  supabase-meta:
    image: supabase/postgres-meta:v0.80.0
    container_name: ai-supabase-meta
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8080/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  supabase-storage:
    image: supabase/storage-api:v0.46.4
    container_name: ai-supabase-storage
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - supabase-storage-data:/var/lib/storage
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - db-network
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  supabase-kong:
    image: kong:2.8.1
    container_name: ai-supabase-kong
    restart: unless-stopped
    ports:
      - "${BIND_IP}:8001:8000"
      - "${BIND_IP}:8444:8443"
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed -e "s|\$${ANON_KEY}|$$ANON_KEY|g" \
            -e "s|\$${SERVICE_ROLE_KEY}|$$SERVICE_ROLE_KEY|g" \
            -e "s|\$${KONG_CORS_ORIGINS}|$$KONG_CORS_ORIGINS|g" \
            /var/lib/kong/kong.yml.template > /tmp/kong.yml
        export KONG_DECLARATIVE_CONFIG=/tmp/kong.yml
        /docker-entrypoint.sh kong docker-start
    volumes:
      - ./supabase/kong.yml.template:/var/lib/kong/kong.yml.template:ro
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - db-network
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "kong health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  supabase-studio:
    image: supabase/studio:20240101-8e4a094  # TODO: Update to latest stable Studio release — current image is from Jan 2024
    container_name: ai-supabase-studio
    restart: unless-stopped
    depends_on:
      supabase-meta:
        condition: service_healthy
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  studio-auth:
    image: nginx:alpine
    container_name: ai-studio-auth
    restart: unless-stopped
    ports:
      - "${BIND_IP}:3005:80"
    volumes:
      - ./supabase/studio-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./supabase/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      supabase-studio:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Workflow & Automation
  # ===========================================================================
  n8n:
    image: n8nio/n8n:1.81.4
    container_name: ai-n8n
    restart: unless-stopped
    ports:
      - "${BIND_IP}:5679:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    environment:
      - N8N_PORT=5678
      - N8N_RUNNERS_DISABLED=true
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-true}
      - GENERIC_TIMEZONE=UTC
      - N8N_HOST=${BIND_IP}
      # PRODUCTION: Set N8N_WEBHOOK_URL to your public URL
      # e.g. N8N_WEBHOOK_URL=https://n8n.example.com/
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://${BIND_IP}:5679/}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
      # Authentication
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - tools-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Chat & Search UIs
  # ===========================================================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.8.3
    container_name: ai-open-webui
    restart: unless-stopped
    ports:
      - "${BIND_IP}:3006:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - tools-network
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  searxng:
    image: searxng/searxng:latest
    container_name: ai-searxng
    restart: unless-stopped
    ports:
      - "${BIND_IP}:8889:8080"
    environment:
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:?SEARXNG_SECRET_KEY must be set}
    volumes:
      - ./searxng:/etc/searxng
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - tools-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Observability & LLM Tools
  # ===========================================================================
  langfuse-db:
    image: postgres:15-alpine
    container_name: ai-langfuse-db
    restart: unless-stopped
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD}
      - POSTGRES_DB=langfuse
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  langfuse:
    image: langfuse/langfuse:2
    container_name: ai-langfuse
    restart: unless-stopped
    ports:
      - "${BIND_IP}:3007:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=${LANGFUSE_SECRET}
      - NEXTAUTH_URL=http://${BIND_IP}:3007
      - SALT=${LANGFUSE_SALT}
      - TELEMETRY_ENABLED=false
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - db-network
      - tools-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  flowise:
    image: flowiseai/flowise:2.2.7
    container_name: ai-flowise
    restart: unless-stopped
    ports:
      - "${BIND_IP}:3008:3000"
    volumes:
      - flowise-data:/home/node/.flowise
    environment:
      - HOME=/home/node
      - FLOWISE_USERNAME=${FLOWISE_USERNAME:-admin}
      - FLOWISE_PASSWORD=${FLOWISE_PASSWORD}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - tools-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Manic AI - Unified API
  # ===========================================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: manic-ai-api
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "${BIND_IP}:8081:8081"
    env_file:
      - .env
    environment:
      OLLAMA_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-llama3.2:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-1024}
      SUPABASE_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@ai-redis:6379
      QDRANT_URL: http://qdrant:6333
      SEARXNG_URL: http://ai-searxng:8080
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_THRESHOLD: ${RAG_THRESHOLD:-0.7}
      RAG_KEYWORD_WEIGHT: ${RAG_KEYWORD_WEIGHT:-0.3}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: http://langfuse:3000
      INFERENCE_BACKEND: ${INFERENCE_BACKEND:-ollama}
      VLLM_URL: ${VLLM_URL:-}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://ai-jaeger:4317"
    depends_on:
      supabase-db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2"
    networks:
      - db-network
      - app-network
      - tools-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Manic AI - MCP Server
  # ===========================================================================
  mcp-server:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: manic-ai-mcp
    restart: unless-stopped
    command: ["python", "-m", "api.mcp_main"]
    env_file:
      - .env
    environment:
      OLLAMA_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-llama3.2:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-1024}
      SUPABASE_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@ai-redis:6379
      QDRANT_URL: http://qdrant:6333
      SEARXNG_URL: http://ai-searxng:8080
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_THRESHOLD: ${RAG_THRESHOLD:-0.7}
      RAG_KEYWORD_WEIGHT: ${RAG_KEYWORD_WEIGHT:-0.3}
    depends_on:
      supabase-db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'api.mcp_main' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
    networks:
      - db-network
      - app-network
      - tools-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Manic AI - Frontend
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: manic-ai-frontend
    restart: unless-stopped
    ports:
      - "${BIND_IP}:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://${BIND_IP}:8081
      - NEXT_PUBLIC_OLLAMA_URL=http://${BIND_IP}:11434
      - NEXT_PUBLIC_SUPABASE_URL=http://${BIND_IP}:8001
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}
    depends_on:
      api:
        condition: service_healthy
      ollama:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Obsidian AI Agent (Paddy) - Sidecar
  # ===========================================================================
  paddy-agent:
    profiles: ["obsidian"]
    build:
      context: ./obsidian-agent
      dockerfile: Dockerfile
    container_name: paddy-agent
    restart: unless-stopped
    ports:
      - "${BIND_IP}:8123:8123"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB}
      - OBSIDIAN_VAULT_PATH=/vault
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ${OBSIDIAN_VAULT_PATH:-./obsidian-vault}:/vault:ro
    depends_on:
      supabase-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - db-network
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8123/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  paddy-rag-pipeline:
    profiles: ["obsidian"]
    build: ./obsidian-agent/backend_rag_pipeline
    container_name: paddy-rag-pipeline
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - RAG_PIPELINE_TYPE=local
      - RUN_MODE=continuous
      - RAG_PIPELINE_ID=${RAG_PIPELINE_ID:-obsidian-vault-rag}
      - RAG_WATCH_DIRECTORY=/vault
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-ollama}
      - EMBEDDING_MODEL_CHOICE=${EMBEDDING_MODEL_CHOICE:-nomic-embed-text}
    volumes:
      - ${OBSIDIAN_VAULT_PATH:-./obsidian-vault}:/vault:ro
    depends_on:
      supabase-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - db-network
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # vLLM Production Inference (optional -- enable with: docker compose --profile vllm up)
  # ===========================================================================
  vllm:
    image: vllm/vllm-openai:v0.7.3
    container_name: ai-vllm
    profiles: ["vllm"]
    restart: unless-stopped
    ports:
      - "${BIND_IP}:8000:8000"
    environment:
      - MODEL_NAME=${VLLM_MODEL:-meta-llama/Llama-3.2-3B-Instruct}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Monitoring Stack (opt-in: docker compose --profile monitoring up -d)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ai-prometheus
    restart: unless-stopped
    ports:
      - "${BIND_IP}:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      # --web.enable-lifecycle is intentionally omitted: it exposes a /-/reload
      # endpoint that allows unauthenticated config reloads. Re-add only if you
      # need hot-reload and have an authenticated reverse proxy in front.
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - monitoring-network
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ai-alertmanager
    restart: unless-stopped
    ports:
      - "${BIND_IP}:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - monitoring-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:2.9.4
    container_name: ai-loki
    restart: unless-stopped
    ports:
      - "${BIND_IP}:3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    networks:
      - monitoring-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    image: grafana/promtail:2.9.4
    container_name: ai-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp/positions
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - monitoring-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ai-grafana
    restart: unless-stopped
    ports:
      - "${BIND_IP}:3009:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - monitoring-network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ai-cadvisor
    restart: unless-stopped
    # privileged: true  # Replaced with explicit capabilities
    cap_add:
      - SYS_PTRACE
    devices:
      - /dev/kmsg:/dev/kmsg
    security_opt:
      - no-new-privileges:true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - monitoring-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: ai-blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - monitoring-network
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: ai-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - monitoring-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: ai-jaeger
    # SECURITY NOTE: Jaeger UI (port 16686) has NO built-in authentication.
    # It is intentionally restricted to the "monitoring" profile and bound to
    # BIND_IP. Do NOT expose this port publicly in production; place it behind
    # an authenticated reverse proxy or VPN if remote access is required.
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "${BIND_IP}:16686:16686"  # Jaeger UI
      - "${BIND_IP}:4317:4317"    # OTLP gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger-data:/badger
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - monitoring-network
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Scheduled Backup (Postgres + Qdrant)
  # ===========================================================================
  backup:
    image: python:3.11-slim
    container_name: ai-backup
    restart: unless-stopped
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    environment:
      - POSTGRES_HOST=supabase-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - BACKUP_DIR=/backups
      - BACKUP_RETENTION_DAYS=7
    entrypoint: >
      sh -c "
        pip install psycopg2-binary -q &&
        echo 'Backup scheduler started. Running daily at 3 AM UTC.' &&
        while true; do
          HOUR=$$(date -u +%H);
          if [ \"$$HOUR\" = '03' ]; then
            python /scripts/backup_db.py >> /var/log/backup.log 2>&1;
            sleep 3600;
          fi;
          sleep 300;
        done
      "
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - db-network
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  db-network:
    driver: bridge
  app-network:
    driver: bridge
  tools-network:
    driver: bridge
  monitoring-network:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  ollama-data:
  qdrant-data:
  redis-data:
  supabase-db-data:
  supabase-storage-data:
  n8n-data:
  open-webui-data:
  langfuse-db-data:
  flowise-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  promtail-positions:
  jaeger-data:
