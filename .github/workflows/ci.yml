name: CI

on:
  pull_request:
    branches: [Manic-AI-Prod]
  push:
    branches: [Manic-AI-Prod]
  schedule:
    # Nightly security scan at 03:00 UTC
    - cron: "0 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Python API — lint & test
  # ------------------------------------------------------------------
  api-lint:
    name: API Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('api/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - run: pip install ruff
      - run: ruff check api/

  api-test:
    name: API Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('api/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - run: pip install -r api/requirements.txt
      - run: pip install ruff pytest pytest-asyncio pytest-cov psycopg2-binary
      - name: Run Alembic migrations (no-op when DB unreachable)
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            python -m alembic upgrade head
          else
            echo "SUPABASE_DB_URL not set — skipping migration in CI"
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - run: cd api && python -m pytest --tb=short -q

  # ------------------------------------------------------------------
  # Frontend — lint & test
  # ------------------------------------------------------------------
  frontend-lint:
    name: Frontend Lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint

  frontend-test:
    name: Frontend Tests (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm test -- --passWithNoTests

  # ------------------------------------------------------------------
  # Build verification
  # ------------------------------------------------------------------
  build-api:
    name: Build API (Docker)
    runs-on: ubuntu-latest
    needs: [api-lint, api-test]
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f api/Dockerfile ]; then
            docker build -t manic-ai-api:ci ./api
          else
            echo "No api/Dockerfile found — skipping Docker build"
          fi

  build-frontend:
    name: Build Frontend (Next.js)
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build

  # ------------------------------------------------------------------
  # Deploy (placeholder — runs only on push to main)
  # ------------------------------------------------------------------
  deploy:
    name: Deploy (placeholder)
    runs-on: ubuntu-latest
    needs: [build-api, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/Manic-AI-Prod'
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploy step — replace with actual deployment commands"

  # ------------------------------------------------------------------
  # Nightly security scan
  # ------------------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      # Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r api/requirements.txt --desc || true

      # Node
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm audit --audit-level=high || true
