name: CI

on:
  pull_request:
    branches: [Manic-AI-Prod]
  push:
    branches: [Manic-AI-Prod]
  schedule:
    # Nightly security scan at 03:00 UTC
    - cron: "0 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Python API — lint & test
  # ------------------------------------------------------------------
  api-lint:
    name: API Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('api/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - run: pip install ruff
      - run: ruff check api/

  api-test:
    name: API Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('api/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - run: pip install -r api/requirements.txt
      - run: pip install ruff pytest pytest-asyncio pytest-cov psycopg2-binary
      - name: Run Alembic migrations
        run: python -m alembic upgrade head
        working-directory: api
        env:
          SUPABASE_DB_URL: postgresql://postgres:testpassword@localhost:5432/testdb
        continue-on-error: true
      - run: cd api && python -m pytest --tb=short -q

  # ------------------------------------------------------------------
  # Frontend — lint & test
  # ------------------------------------------------------------------
  frontend-lint:
    name: Frontend Lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint

  frontend-test:
    name: Frontend Tests (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm test

  # ------------------------------------------------------------------
  # Build verification
  # ------------------------------------------------------------------
  build-api:
    name: Build API (Docker)
    runs-on: ubuntu-latest
    needs: [api-lint, api-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: manic-ai-api:ci-${{ github.sha }}

  build-frontend:
    name: Build Frontend (Next.js)
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build

  # ------------------------------------------------------------------
  # Deploy (SSH to production host on push to main)
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-api, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/Manic-AI-Prod'
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/Desktop/Manic-AI
            git pull origin Manic-AI-Prod
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps

  # ------------------------------------------------------------------
  # Security scan (runs on all events, blocking)
  # ------------------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r api/requirements.txt --desc

      # Node
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm audit --audit-level=high
