name: CI

on:
  pull_request:
    branches: [Manic-AI-Prod]
  push:
    branches: [Manic-AI-Prod]
  schedule:
    # Nightly security scan at 03:00 UTC
    - cron: "0 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write   # For SARIF upload
  packages: write          # For GHCR image push

jobs:
  # ------------------------------------------------------------------
  # Python API — lint & test
  # ------------------------------------------------------------------
  api-lint:
    name: API Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('api/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - run: pip install ruff
      - run: ruff check api/

  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1

  api-test:
    name: API Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('api/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - run: pip install -r api/requirements.txt
      - run: pip install ruff pytest pytest-asyncio pytest-cov psycopg2-binary
      - name: Run Alembic migrations
        run: python -m alembic upgrade head
        working-directory: api
        env:
          SUPABASE_DB_URL: postgresql://postgres:testpassword@localhost:5432/testdb
          API_SECRET_KEY: testsecret
        continue-on-error: true
      - name: Run tests with coverage
        run: |
          cd api && python -m pytest \
            --tb=short -q \
            --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing \
            --junitxml=test-results.xml
        env:
          SUPABASE_DB_URL: postgresql://postgres:testpassword@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379
          ALLOW_UNAUTHENTICATED: "true"
          API_SECRET_KEY: testsecret
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: |
            api/coverage.xml
            api/test-results.xml

  # ------------------------------------------------------------------
  # Frontend — lint, typecheck & test
  # ------------------------------------------------------------------
  frontend-lint:
    name: Frontend Lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint

  frontend-typecheck:
    name: Frontend Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc --noEmit

  frontend-test:
    name: Frontend Tests (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm test -- --coverage --forceExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ------------------------------------------------------------------
  # Build verification
  # ------------------------------------------------------------------
  build-api:
    name: Build API (Docker)
    runs-on: ubuntu-latest
    needs: [api-lint, api-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('api/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - run: pip install -r api/requirements.txt
      - name: Export OpenAPI spec
        run: python -c "from api.app import app; import json; print(json.dumps(app.openapi(), indent=2))" > api-openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: api-openapi.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/Manic-AI-Prod'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/Manic-AI-Prod' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/Manic-AI-Prod' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            manic-ai-api:ci-${{ github.sha }}
            ghcr.io/mrvitality/manic-ai-api:${{ github.sha }}
            ghcr.io/mrvitality/manic-ai-api:latest
      # Trivy scan the built image
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: manic-ai-api:ci-${{ github.sha }}
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          exit-code: 0   # Don't fail the build, just report
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

  build-frontend:
    name: Build Frontend (Next.js + Docker)
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-typecheck, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/Manic-AI-Prod'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/Manic-AI-Prod' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/mrvitality/manic-ai-frontend:${{ github.sha }}
            ghcr.io/mrvitality/manic-ai-frontend:latest

  # ------------------------------------------------------------------
  # Docker Compose validation
  # ------------------------------------------------------------------
  docker-compose-check:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml syntax
        run: |
          # Create minimal .env so compose config doesn't fail on required vars
          cat > .env <<'ENVEOF'
          QDRANT_API_KEY=test
          SEARXNG_SECRET_KEY=test
          GRAFANA_ADMIN_PASSWORD=test
          LANGFUSE_DB_PASSWORD=test
          ANTHROPIC_API_KEY=test
          BIND_IP=0.0.0.0
          POSTGRES_PASSWORD=test
          POSTGRES_USER=postgres
          POSTGRES_DB=postgres
          PUBLIC_DOMAIN=manixsystems.ai
          ENVEOF
          docker compose config --quiet
          echo "docker-compose.yml is valid"

  # ------------------------------------------------------------------
  # Security scan (runs on all events)
  # ------------------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python dependency audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit safety bandit
      - name: pip-audit
        run: pip-audit -r api/requirements.txt --desc
        continue-on-error: true
      - name: Bandit (SAST)
        run: bandit -r api/ -f json -o bandit-report.json -ll || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

      # Node dependency audit
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: npm audit
        run: cd frontend && npm audit --audit-level=high
        continue-on-error: true

      # Trivy filesystem scan (IaC, secrets, misconfig)
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

      # Secret scanning
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ------------------------------------------------------------------
  # SQL schema validation
  # ------------------------------------------------------------------
  sql-check:
    name: SQL Schema Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pgvector extension
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          # pgvector isn't available in the service container, so we validate syntax only
          echo "Checking SQL file syntax..."
      - name: Validate init.sql loads without errors
        run: |
          # Replace vector types with text for syntax validation (pgvector not in vanilla PG)
          sed 's/VECTOR([0-9]*)/TEXT/g; s/vector_cosine_ops/text_ops/g; s/USING hnsw/USING btree/g; s/USING gin.*gin_trgm_ops/USING btree/g' \
            supabase/init.sql > /tmp/init-check.sql
          PGPASSWORD=testpassword psql -h localhost -U postgres -d testdb -f /tmp/init-check.sql -v ON_ERROR_STOP=0 2>&1 | tail -20
          echo "SQL schema validation complete"
        continue-on-error: true

  # ------------------------------------------------------------------
  # Deploy (SSH to production host on push to main)
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-api, build-frontend, security-scan, docker-compose-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/Manic-AI-Prod'
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/Desktop/Manic-AI
            git pull origin Manic-AI-Prod
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
      - name: Verify deployment health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sleep 15
            curl -sf http://localhost:8081/health || echo "API health check pending..."
            curl -sf http://localhost:3000 || echo "Frontend health check pending..."
