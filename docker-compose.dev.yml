# Development override — use with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
name: manic-ai

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - ./api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8081 --reload
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: debug

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true

  # Expose debug ports for n8n in dev
  n8n:
    environment:
      - N8N_LOG_LEVEL=debug

  # Expose Qdrant web UI in dev
  qdrant:
    ports:
      - "${BIND_IP}:6333:6333"
      - "${BIND_IP}:6334:6334"
