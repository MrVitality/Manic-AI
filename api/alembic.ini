# Alembic configuration for Manic-AI FastAPI backend.
# sqlalchemy.url is intentionally left as a placeholder — env.py overrides it
# at runtime from the SUPABASE_DB_URL environment variable.

[alembic]
# Path to migration scripts (relative to this file's directory)
script_location = %(here)s/alembic

# File-name template for new revision files
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path prepend (needed so `api` package is importable when running alembic
# from the repo root)
prepend_sys_path = .

# Timezone for generated file timestamps
# timezone =

# Slug max length
# truncate_slug_length = 40

# Run env.py on every 'revision' call (needed for autogenerate)
# revision_environment = false

# version_path_separator; default "os" uses os.pathsep
version_path_separator = os

# Placeholder URL — overridden dynamically in env.py from SUPABASE_DB_URL.
sqlalchemy.url = postgresql://user:pass@localhost/dbname


[post_write_hooks]
# Uncomment to auto-format new migration files with black:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 99 REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
