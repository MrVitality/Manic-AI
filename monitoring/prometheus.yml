global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['ai-alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts/*.rules.yml

scrape_configs:
  - job_name: "manic-ai-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8081"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "qdrant"
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: 'redis'
    static_configs:
      - targets: ['ai-redis-exporter:9121']
