global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['ai-alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts/*.rules.yml

scrape_configs:
  - job_name: "manic-ai-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8081"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "qdrant"
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: 'redis'
    static_configs:
      - targets: ['ai-redis-exporter:9121']

  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - 'http://frontend:3000'
          - 'http://api:8081/health'
          - 'http://api:8081/health/ready'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: ai-blackbox-exporter:9115
