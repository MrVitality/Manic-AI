global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    # Configure one of these receivers for your environment:
    # Slack:
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#alerts'
    #     send_resolved: true
    # Email:
    # email_configs:
    #   - to: 'admin@example.com'
    #     from: 'alertmanager@manic-ai.local'
    #     smarthost: 'smtp.gmail.com:587'
    #     auth_username: 'your-email@gmail.com'
    #     auth_password: 'app-password'
    webhook_configs:
      - url: 'http://localhost:9095/alert'
        send_resolved: true
        # Placeholder -- replace with your actual webhook endpoint
